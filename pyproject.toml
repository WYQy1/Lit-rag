[project]
name = "lit-rag"
version = "0.1.0"
description = "文献检索问答（RAG）系统 —— 从 LLM API 调用到完整 RAG 链路的练习与落地项目"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "WYQy1", email = "2016784812@qq.com" }]
keywords = ["rag", "llm", "agent", "literature", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]

dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# 本项目是脚本式学习项目，不需要被打包安装
[tool.uv]
package = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".idea",
    # 早期学习用的临时脚本，不属于项目代码，不参与 lint
    "test.py",
    "test2.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # 行宽由 formatter 负责
]

[tool.ruff.lint.per-file-ignores]
# 学习脚本允许直接 print、允许导入后未使用
"hello-llm/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
